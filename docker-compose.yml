services:

  index:
    build: .
    container_name: services-index
    hostname: ${INDEX_HOSTNAME:-services-index}    
    image: services/index:${INDEX_VERSION:-latest}
    ports:
      - 8000:80
    restart: unless-stopped
    volumes:
      - ${INDEX_VOLUME_ETC:-./volumes/etc/index}:/etc/index
      - ${INDEX_VOLUME_VAR:-./src/www/html}:/var/www/html
      - ${INDEX_VOLUME_VAR_IMAGES_ICONS:-./volumes/var/www/html/images/icons}:/var/www/html/images/icons
